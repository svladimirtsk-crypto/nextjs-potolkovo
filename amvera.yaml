meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  # PT-006: RELEASE=1 включает блокирующую проверку реквизитов (check:legal
  # в prebuild). Без флага сборка выкатывала бы политику с незаполненным
  # оператором персональных данных, как это уже произошло.
  additionalCommands: RELEASE=1 npm run build

run:
  command: npm run start
  containerPort: 3000
