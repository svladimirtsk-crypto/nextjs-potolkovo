name: CI

on:
  pull_request:
  push:
    branches: [quizv2, quizv2ver1, main]

# Новый пуш в ту же ветку отменяет предыдущий прогон — незачем греть раннеры.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Быстрые проверки: падают за секунды и дают понятную причину.
  static:
    name: Lint · types · unit
    runs-on: ubuntu-latest

    # N-001: без реальной БД интеграционные тесты хранилища молча пропускаются,
    # и регрессия в PgLeadStore доехала бы до прода незамеченной.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potolkovo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/potolkovo_test
      CRON_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Применить схему БД
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Unit-тесты (vitest)
        run: npm run test

      - name: Окружение и реквизиты
        # PT-006: RELEASE=1 делает проверку блокирующей. Раньше скрипт
        # вызывался без флага и только предупреждал — то есть не срабатывал
        # ни разу, и TODO_OWNER доехал до прода в тексте политики.
        # На фиче-ветках оставляем мягкий режим: там реквизиты могут быть
        # временно не в фокусе, и падать из-за них посреди работы незачем.
        env:
          RELEASE: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/quizv2ver1') && '1' || '' }}
          # CI не владеет боевыми секретами, и это нормально: здесь объявлена
          # СОГЛАСОВАННАЯ конфигурация «Telegram выключен, есть запасной канал,
          # БД — локальная тестовая». Значения заведомо не секретные.
          #
          # Без этого `check:env` в strict-режиме падал на каждом пуше в main и
          # quizv2ver1 (то есть сразу после мержа), а так как build и e2e
          # зависят от static — сборка, бюджет бандла и Playwright для слитого
          # кода не выполнялись вовсе. На pull_request этого не было видно:
          # там github.ref = refs/pull/N/merge, RELEASE пуст и режим мягкий.
          #
          # Проверка при этом НЕ ослаблена: расхождение .env.example со схемой
          # по-прежнему безусловно фатально, а несогласованная комбинация
          # (TELEGRAM_LEADS_ENABLED=1 без токена) по-прежнему даёт ошибку.
          # Строгими остаются и реквизиты — именно их касается PT-006.
          TELEGRAM_LEADS_ENABLED: "0"
          WEB3FORMS_ACCESS_KEY: ci-not-a-secret
          CRON_SECRET: ci-not-a-secret
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npm run check:env
          npm run check:legal

      - name: Каталог
        run: npm run validate:catalog

      # N-061 (F-21): ручной календарь замеров устаревает молча — страж
      # напоминает обновить его, пока даты ещё не начали врать.
      - name: Календарь замеров
        run: node scripts/check-availability.mjs

  build:
    name: Build · bundle budget
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Бюджет бандла (главная ≤ 300 КБ)
        run: npm run check:bundle

      # Сборку переиспользует job e2e — второй раз собирать незачем.
      #
      # Пакуем в tar, а не отдаём каталоги upload-artifact напрямую. v4 молча
      # пропускает каталоги, начинающиеся с точки, поэтому `.next` в артефакт не
      # попадал: выходило 3 295 442 байта вместо 8 628 462 — ровно столько же,
      # сколько дают одни `public/optimized` + `data`. Job e2e оставался без
      # сборки, `next start` падал с «Could not find a production build in the
      # '.next' directory» (exit 1), а Playwright выдавал непрозрачное «Process
      # from config.webServer was not able to start. Exit code: 1». Ни один
      # e2e-тест в CI не выполнялся, и недели это выглядело как «падают e2e».
      # tar заодно сохраняет симлинки (.next/node_modules/pg-*) и права доступа.
      - name: Упаковать сборку
        run: tar -czf next-build.tar.gz .next public/optimized data

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          # Молчаливый пропуск файлов больше не должен быть возможен:
          # пустой артефакт обязан валить job, а не ждать падения в e2e.
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Восстановить сборку
        uses: actions/download-artifact@v4
        with:
          name: next-build

      # Проверяем, что сборка действительно на месте. Без .next `next start`
      # падает с exit 1 ещё до первого теста, а причина остаётся невидимой —
      # Playwright сообщает только «webServer was not able to start».
      - name: Распаковать сборку
        run: |
          tar -xzf next-build.tar.gz
          rm -f next-build.tar.gz
          test -f .next/BUILD_ID
          echo "Сборка восстановлена, BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Установить браузеры
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: Секреты (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: секрет мог попасть в старый коммит.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
