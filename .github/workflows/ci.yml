name: CI

on:
  pull_request:
  push:
    branches: [quizv2, quizv2ver1, main]

# Новый пуш в ту же ветку отменяет предыдущий прогон — незачем греть раннеры.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Быстрые проверки: падают за секунды и дают понятную причину.
  static:
    name: Lint · types · unit
    runs-on: ubuntu-latest

    # N-001: без реальной БД интеграционные тесты хранилища молча пропускаются,
    # и регрессия в PgLeadStore доехала бы до прода незамеченной.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potolkovo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/potolkovo_test
      CRON_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Применить схему БД
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Unit-тесты (vitest)
        run: npm run test

      - name: Окружение и реквизиты
        run: |
          npm run check:env
          npm run check:legal

      - name: Каталог
        run: npm run validate:catalog

  build:
    name: Build · bundle budget
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Бюджет бандла (главная ≤ 300 КБ)
        run: npm run check:bundle

      # Сборку переиспользует job e2e — второй раз собирать незачем.
      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public/optimized
            data
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Восстановить сборку
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Установить браузеры
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: Секреты (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: секрет мог попасть в старый коммит.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
